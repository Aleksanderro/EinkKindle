[project]
name = "einkkindle"
version = "0.1.0"
description = "Battery-powered weather dashboard for Kindle 4 Non-Touch"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "Pillow",
    "PyYAML",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]
namespaces = false