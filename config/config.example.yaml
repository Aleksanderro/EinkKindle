location:
  name: "Warsaw"
  latitude: 52.2297
  longitude: 21.0122
  timezone: "Europe/Warsaw"

weather:
  provider: "open-meteo"

calendar:
  provider: "google"
  view: current_week
  week_start: monday
  calendar_id: "primary"
  oauth_client_credentials_path: "config/local/google-oauth-client.json"
  token_store_path: "config/local/google-calendar-token.json"

display:
  width: 600
  height: 800

schedule:
  active_from: "07:00"
  active_until: "23:00"
  refresh_interval_minutes: 60

server:
  host: "0.0.0.0"
  port: 8787
